name: verify

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: happylearn
          POSTGRES_PASSWORD: happylearn_dev
          POSTGRES_DB: happylearn
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U happylearn -d happylearn"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: govulncheck ./...
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: docker compose -f deploy/compose.dev.yml config --quiet
      - run: docker build --tag happylearn:ci .

  e2e:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make e2e