name: verify

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e-contracts
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Start private integration dependencies
        run: docker compose -p happylearn-ci -f deploy/compose.dev.yml up -d --wait --wait-timeout 120 postgres redis minio
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: govulncheck ./...
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm lint
      - run: pnpm --dir web build
      - run: pnpm audit --prod
      - run: docker compose -f deploy/compose.dev.yml config --quiet
      - run: docker build --tag happylearn:ci .
      - run: docker build --file Dockerfile.worker --tag happylearn-worker:ci .
      - name: Verify hardened image metadata
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' happylearn:ci)" = '10001:10001'
          test "$(docker image inspect -f '{{.Config.User}}' happylearn-worker:ci)" = '10002:10002'
          test "$(docker image inspect -f '{{json .Config.Healthcheck.Test}}' happylearn:ci)" != 'null'
          test "$(docker image inspect -f '{{json .Config.Healthcheck.Test}}' happylearn-worker:ci)" != 'null'
      - name: Stop integration dependencies
        if: always()
        run: docker compose -p happylearn-ci -f deploy/compose.dev.yml down --volumes --remove-orphans

  phase2-e2e:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run isolated Phase 2 acceptance
        run: bash scripts/e2e-phase2.sh
      - name: Upload sanitized disposable failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase2-failure-${{ github.run_id }}
          path: test-results/phase2/containers.log
          if-no-files-found: ignore
          retention-days: 7

  phase3-e2e:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run isolated Phase 3 acceptance
        run: bash scripts/e2e-phase3.sh
      - name: Upload sanitized disposable failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-failure-${{ github.run_id }}
          path: test-results/phase3/containers.log
          if-no-files-found: ignore
          retention-days: 7
