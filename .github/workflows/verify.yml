name: verify

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e-contracts
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Start private integration dependencies
        run: docker compose -p happylearn-ci -f deploy/compose.dev.yml -f deploy/compose.ci.yml up -d --wait --wait-timeout 120 postgres redis minio
      - name: Verify host integration ports
        run: |
          for port in 54329 56379 59000; do
            timeout 30 bash -c "until </dev/tcp/127.0.0.1/$port; do sleep 1; done"
          done
      - name: Verify authenticated MinIO readiness
        run: |
          timeout 30 docker compose -p happylearn-ci -f deploy/compose.dev.yml -f deploy/compose.ci.yml exec -T minio /bin/sh -ceu 'until mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ls local >/dev/null 2>&1; do sleep 1; done' || { echo 'MinIO did not accept an authenticated ListBuckets request within 30s.' >&2; exit 1; }
      - run: GOENV=off GOFLAGS='' go test -p 1 ./... -count=1
      - run: GOENV=off GOFLAGS='' go test -race -p 1 ./... -count=1
      - run: go vet ./...
      - run: govulncheck ./...
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm lint
      - run: pnpm --dir web build
      - run: pnpm audit --prod
      - run: docker compose -f deploy/compose.dev.yml config --quiet
      - run: docker compose -f deploy/compose.dev.yml -f deploy/compose.ci.yml config --quiet
      - run: docker build --tag happylearn:ci .
      - run: docker build --file Dockerfile.worker --tag happylearn-worker:ci .
      - name: Verify hardened image metadata
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' happylearn:ci)" = '10001:10001'
          test "$(docker image inspect -f '{{.Config.User}}' happylearn-worker:ci)" = '10002:10002'
          test "$(docker image inspect -f '{{json .Config.Healthcheck.Test}}' happylearn:ci)" != 'null'
          test "$(docker image inspect -f '{{json .Config.Healthcheck.Test}}' happylearn-worker:ci)" != 'null'
      - name: Report integration dependency failure
        if: failure()
        run: |
          docker compose -p happylearn-ci -f deploy/compose.dev.yml -f deploy/compose.ci.yml ps
          docker compose -p happylearn-ci -f deploy/compose.dev.yml -f deploy/compose.ci.yml logs --no-color --tail 100 minio
      - name: Stop integration dependencies
        if: always()
        run: docker compose -p happylearn-ci -f deploy/compose.dev.yml -f deploy/compose.ci.yml down --volumes --remove-orphans

  phase2-e2e:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run isolated Phase 2 acceptance
        run: bash scripts/e2e-phase2.sh
      - name: Upload sanitized disposable failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase2-failure-${{ github.run_id }}
          path: test-results/phase2/containers.log
          if-no-files-found: ignore
          retention-days: 7

  phase3-e2e:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run isolated Phase 3 acceptance
        run: bash scripts/e2e-phase3.sh
      - name: Upload sanitized disposable failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-failure-${{ github.run_id }}
          path: test-results/phase3/containers.log
          if-no-files-found: ignore
          retention-days: 7

  phase5-e2e:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run isolated Phase 5 acceptance
        run: HAPPYLEARN_E2E_GROUP=all make e2e-phase5
      - name: Upload sanitized Phase 5 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase5-failure-${{ github.run_id }}
          path: test-results/phase5/containers.log
          if-no-files-found: ignore
          retention-days: 7
