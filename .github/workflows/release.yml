name: github-release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_commit: ${{ steps.validate-tag.outputs.release_commit }}
      archive_name: ${{ steps.package.outputs.archive_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable stable version tag
        id: validate-tag
        env:
          RELEASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          release_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$release_commit" = "$event_commit"
          git fetch --no-tags origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          git merge-base --is-ancestor "$release_commit" "refs/remotes/origin/${RELEASE_BRANCH}"
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful full verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?branch=${RELEASE_BRANCH}&head_sha=${RELEASE_COMMIT}&event=push&per_page=1")"
          status="$(jq -r '.workflow_runs[0].status // ""' <<<"$response")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$response")"
          test "$status" = completed
          test "$conclusion" = success

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: GOENV=off GOFLAGS='' go test ./cmd/update-agent ./internal/updates -count=1
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm lint
      - run: pnpm --dir web build

      - name: Package deterministic release source archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive_root="VAYZRA-${GITHUB_REF_NAME}"
          archive_name="${archive_root}.tar.gz"
          package_dir="$RUNNER_TEMP/github-release-package"
          archive_file="$package_dir/$archive_name"
          install -d -m 0700 "$package_dir"
          git archive --format=tar --prefix="${archive_root}/" "$RELEASE_COMMIT" | gzip -n > "$archive_file"

          archive_listing=$(mktemp "$package_dir/archive-listing.XXXXXX")
          trap 'rm -f -- "$archive_listing"' EXIT
          tar -tzf "$archive_file" > "$archive_listing"
          mapfile -t archive_entries < "$archive_listing"
          ((${#archive_entries[@]} > 0))
          declare -A seen_entries=()
          for entry in "${archive_entries[@]}"; do
            [[ -n $entry && $entry == "${archive_root}/"* && $entry != /* ]] || exit 1
            [[ -z ${seen_entries[$entry]+_} ]] || exit 1
            seen_entries["$entry"]=1
            relative_entry=${entry#"${archive_root}/"}
            [[ -z $relative_entry || ( $relative_entry != .. && $relative_entry != ../* && $relative_entry != */.. && $relative_entry != */../* ) ]] || exit 1
          done
          rm -f -- "$archive_listing"
          trap - EXIT

          cd "$package_dir"
          sha256sum "$archive_name" > SHA256SUMS
          expected_checksum=$(mktemp "$package_dir/expected-checksum.XXXXXX")
          trap 'rm -f -- "$expected_checksum"' EXIT
          sha256sum "$archive_name" > "$expected_checksum"
          cmp -s "$expected_checksum" SHA256SUMS
          sha256sum --check SHA256SUMS
          rm -f -- "$expected_checksum"
          trap - EXIT
          for package_file in "$archive_file" "$package_dir/SHA256SUMS"; do
            [[ -f $package_file && ! -L $package_file ]]
          done
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-release-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/github-release-package/${{ steps.package.outputs.archive_name }}
            ${{ runner.temp }}/github-release-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: github-release-package-${{ github.run_id }}
          path: ${{ runner.temp }}/github-release-package

      - name: Revalidate tag and publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive_root="VAYZRA-${GITHUB_REF_NAME}"
          archive_name="$ARCHIVE_NAME"
          package_dir="$RUNNER_TEMP/github-release-package"
          archive_file="$package_dir/$archive_name"
          checksum_file="$package_dir/SHA256SUMS"
          expected_files=$(printf '%s\n%s\n' "$archive_name" SHA256SUMS | LC_ALL=C sort)
          top_level_files=$(find "$package_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          actual_files=$(find "$package_dir" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          [[ "$top_level_files" == "$expected_files" && "$actual_files" == "$expected_files" ]]
          for package_file in "$archive_file" "$checksum_file"; do
            [[ -f $package_file && ! -L $package_file ]]
          done
          cd "$package_dir"
          expected_checksum=$(mktemp "$package_dir/expected-checksum.XXXXXX")
          trap 'rm -f -- "$expected_checksum"' EXIT
          sha256sum "$archive_name" > "$expected_checksum"
          cmp -s "$expected_checksum" SHA256SUMS
          sha256sum --check SHA256SUMS
          rm -f -- "$expected_checksum"
          trap - EXIT
          archive_listing=$(mktemp "$package_dir/archive-listing.XXXXXX")
          trap 'rm -f -- "$archive_listing"' EXIT
          tar -tzf "$archive_file" > "$archive_listing"
          mapfile -t archive_entries < "$archive_listing"
          ((${#archive_entries[@]} > 0))
          declare -A seen_entries=()
          for entry in "${archive_entries[@]}"; do
            [[ -n $entry && $entry == "${archive_root}/"* && $entry != /* ]] || exit 1
            [[ -z ${seen_entries[$entry]+_} ]] || exit 1
            seen_entries["$entry"]=1
            relative_entry=${entry#"${archive_root}/"}
            [[ -z $relative_entry || ( $relative_entry != .. && $relative_entry != ../* && $relative_entry != */.. && $relative_entry != */../* ) ]] || exit 1
          done
          rm -f -- "$archive_listing"
          trap - EXIT

          tag_ref=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          object_type=$(jq -r '.object.type' <<<"$tag_ref")
          object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          for _ in {1..5}; do
            if [[ "$object_type" == commit ]]; then
              break
            fi
            [[ "$object_type" == tag ]]
            tag_object=$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
            object_type=$(jq -r '.object.type' <<<"$tag_object")
            object_sha=$(jq -r '.object.sha' <<<"$tag_object")
          done
          [[ "$object_type" == commit && "$object_sha" == "$RELEASE_COMMIT" ]]

          release_view=''
          if release_view=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,isImmutable,assets 2>/dev/null); then
            release_assets=$(jq -r '[.assets[].name] | sort | .[]' <<<"$release_view")
            [[ $(jq -r .tagName <<<"$release_view") == "$GITHUB_REF_NAME" ]]
            [[ $(jq -r .isPrerelease <<<"$release_view") == false ]]
            if [[ $(jq -r .isDraft <<<"$release_view") == true ]]; then
              [[ $(jq -r .isImmutable <<<"$release_view") == false && "$release_assets" == "$expected_files" ]] || {
                echo "Existing draft release for $GITHUB_REF_NAME is partial or unexpected; inspect it and delete it manually before retrying." >&2
                exit 1
              }
            else
              [[ $(jq -r .isImmutable <<<"$release_view") == true && "$release_assets" == "$expected_files" ]] || {
                echo "Existing published release for $GITHUB_REF_NAME is not the expected immutable terminal state; inspect it manually." >&2
                exit 1
              }
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$archive_file" "$checksum_file" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME" --draft
          fi

          if [[ -z $release_view || $(jq -r .isDraft <<<"$release_view") == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          release_json=$(gh api --header 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          [[ $(jq -r .tag_name <<<"$release_json") == "$GITHUB_REF_NAME" ]]
          [[ $(jq -r .draft <<<"$release_json") == false ]]
          [[ $(jq -r .prerelease <<<"$release_json") == false ]]
          [[ $(jq -r .immutable <<<"$release_json") == true ]]
          release_assets=$(jq -r '[.assets[].name] | sort | .[]' <<<"$release_json")
          [[ "$release_assets" == "$expected_files" ]]
