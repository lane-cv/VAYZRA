name: phase6-production

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:
    inputs:
      run_production:
        description: Run the complete licensed Phase 6 production acceptance
        required: true
        default: false
        type: boolean
      run_resources:
        description: Run the licensed 30-minute resource capture
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  phase6-contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v5.3.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - name: Run repository-only Phase 6 contracts and mutations
        run: make phase6-contracts
      - name: Validate Caddy configs with the pinned runtime parser
        run: make phase6-caddy-runtime-contract

  phase6-license-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.run_production || inputs.run_resources)) ||
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require protected AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: test -n "$AISTOR_LICENSE"

  phase6-production:
    if: github.event_name == 'workflow_dispatch' && inputs.run_production
    needs: [phase6-contracts, phase6-license-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v5.3.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.66.0
      - name: Install scanners and dependencies
        run: |
          pnpm install --frozen-lockfile
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Run complete disposable production acceptance
        run: |
          HAPPYLEARN_E2E_GROUP=all timeout --foreground --kill-after=30s 19800s bash scripts/e2e-phase6.sh
          HAPPYLEARN_E2E_GROUP=security timeout --foreground --kill-after=30s 7200s bash scripts/e2e-phase6.sh
      - name: Upload sanitized Phase 6 failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-failure-${{ github.run_id }}
          path: test-results/phase6/*/containers.log
          if-no-files-found: ignore
          retention-days: 7

  phase6-resources:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_resources)
    needs: phase6-license-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v5.3.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Configure disposable AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.HAPPYLEARN_AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          umask 077
          license_file="$RUNNER_TEMP/minio.license"
          printf '%s' "$AISTOR_LICENSE" > "$license_file"
          sudo chgrp 0 "$license_file"
          chmod 0440 "$license_file"
          printf 'HAPPYLEARN_AISTOR_LICENSE_FILE=%s\n' "$license_file" >> "$GITHUB_ENV"
      - name: Capture production resources for exactly 30 minutes
        run: HAPPYLEARN_E2E_GROUP=resources timeout --foreground --kill-after=30s 3300s bash scripts/e2e-phase6.sh
      - name: Upload sanitized Phase 6 resource failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-resources-failure-${{ github.run_id }}
          path: test-results/phase6/*/containers.log
          if-no-files-found: ignore
          retention-days: 7
