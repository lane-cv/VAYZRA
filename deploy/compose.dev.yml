services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: happylearn
      POSTGRES_PASSWORD: happylearn_dev
      POSTGRES_DB: happylearn
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happylearn -d happylearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

  redis:
    image: redis:8.8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

networks:
  happylearn:
    driver: bridge
