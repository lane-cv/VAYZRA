services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: happylearn
      POSTGRES_PASSWORD: happylearn_dev
      POSTGRES_DB: happylearn
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happylearn -d happylearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

  redis:
    image: redis:8.8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

  minio:
    build:
      context: ..
      dockerfile: Dockerfile.minio
    image: happylearn-minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      MINIO_ROOT_PASSWORD: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/lib/apt/apt-helper", "download-file", "http://127.0.0.1:9000/minio/health/live", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - happylearn
networks:
  happylearn:
    driver: bridge

volumes:
  minio_data:
