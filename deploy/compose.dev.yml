services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: happylearn
      POSTGRES_PASSWORD: happylearn_dev
      POSTGRES_DB: happylearn
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happylearn -d happylearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn
    mem_limit: 512m
    cpus: 0.35

  redis:
    image: redis:8.8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn
    mem_limit: 128m
    cpus: 0.15

  minio-data-init:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:0 /data && chmod 0750 /data"]
    volumes:
      - minio_data:/data
    network_mode: "none"
    restart: "no"

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "1000:0"
    command: ["minio", "server", "/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      MINIO_ROOT_PASSWORD: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    secrets:
      - source: aistor_license
        target: /minio.license
        uid: "1000"
        gid: "0"
        mode: 0440
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - happylearn
    mem_limit: 512m
    cpus: 0.3

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      HAPPYLEARN_ENV: development
      HAPPYLEARN_LISTEN: ":8080"
      HAPPYLEARN_DATABASE_URL: postgres://happylearn:happylearn_dev@postgres:5432/happylearn?sslmode=disable
      HAPPYLEARN_REDIS_URL: redis://redis:6379/0
      HAPPYLEARN_LOGIN_THROTTLE_SECRET: development-only-app-secret-at-least-32-bytes
      HAPPYLEARN_PUBLIC_ORIGIN: http://127.0.0.1:8080
      HAPPYLEARN_AI_MASTER_KEY: ${HAPPYLEARN_AI_MASTER_KEY:-}
      HAPPYLEARN_AI_MASTER_KEY_VERSION: ${HAPPYLEARN_AI_MASTER_KEY_VERSION:-1}
      HAPPYLEARN_AI_BUSINESS_TIMEZONE: ${HAPPYLEARN_AI_BUSINESS_TIMEZONE:-Asia/Shanghai}
      HAPPYLEARN_AI_GLOBAL_CONCURRENCY: ${HAPPYLEARN_AI_GLOBAL_CONCURRENCY:-2}
      HAPPYLEARN_AI_PER_STUDENT_CONCURRENCY: ${HAPPYLEARN_AI_PER_STUDENT_CONCURRENCY:-1}
      HAPPYLEARN_AI_ALLOW_PRIVATE_PROVIDER: ${HAPPYLEARN_AI_ALLOW_PRIVATE_PROVIDER:-false}
      HAPPYLEARN_MINIO_ENDPOINT: minio:9000
      HAPPYLEARN_MINIO_ACCESS_KEY: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      HAPPYLEARN_MINIO_SECRET_KEY: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
      HAPPYLEARN_MINIO_ORIGINALS_BUCKET: happylearn-originals
      HAPPYLEARN_MINIO_PREVIEWS_BUCKET: happylearn-previews
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - happylearn

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    user: "10002:10002"
    environment:
      HAPPYLEARN_ENV: development
      HAPPYLEARN_LISTEN: ":8080"
      HAPPYLEARN_DATABASE_URL: postgres://happylearn:happylearn_dev@postgres:5432/happylearn?sslmode=disable
      HAPPYLEARN_REDIS_URL: redis://redis:6379/0
      HAPPYLEARN_LOGIN_THROTTLE_SECRET: development-only-worker-secret-at-least-32-bytes
      HAPPYLEARN_PUBLIC_ORIGIN: http://127.0.0.1:8080
      HAPPYLEARN_MINIO_ENDPOINT: minio:9000
      HAPPYLEARN_MINIO_ACCESS_KEY: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      HAPPYLEARN_MINIO_SECRET_KEY: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
      HAPPYLEARN_MINIO_ORIGINALS_BUCKET: happylearn-originals
      HAPPYLEARN_MINIO_PREVIEWS_BUCKET: happylearn-previews
      HAPPYLEARN_WORK_DIR: /work
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,size=1024m,uid=10002,gid=10002,mode=0700
      - /tmp:rw,noexec,nosuid,size=32m,uid=10002,gid=10002,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1792m
    cpus: 1.0
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1792m
          cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - happylearn

networks:
  happylearn:
    driver: bridge
    internal: true

volumes:
  minio_data:

secrets:
  aistor_license:
    file: ${HAPPYLEARN_AISTOR_LICENSE_FILE:?set HAPPYLEARN_AISTOR_LICENSE_FILE to the downloaded AIStor Free minio.license path}
