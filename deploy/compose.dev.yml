x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres-tls-init:
    logging: *default-logging
    image: postgres:18.4
    user: "0:0"
    entrypoint:
      - /usr/bin/timeout
      - --foreground
      - --kill-after=10s
      - 300s
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        if [ ! -s /tls/server.crt ] || [ ! -s /tls/server.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj /CN=postgres \
            -keyout /tls/server.key -out /tls/server.crt
        fi
        chown postgres:postgres /tls/server.crt /tls/server.key
        chmod 0600 /tls/server.key
        chmod 0644 /tls/server.crt
    volumes:
      - postgres_tls:/tls
    network_mode: "none"
    restart: "no"

  postgres:
    logging: *default-logging
    image: postgres:18.4
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    environment:
      POSTGRES_USER: happylearn
      POSTGRES_PASSWORD: happylearn_dev
      POSTGRES_DB: happylearn
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happylearn -d happylearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn
    volumes:
      - postgres_tls:/tls:ro
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 0.35

  redis:
    logging: *default-logging
    image: redis:8.8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn
    mem_limit: 128m
    cpus: 0.15

  minio-data-init:
    logging: *default-logging
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:0 /data && chmod 0750 /data"]
    volumes:
      - minio_data:/data
    network_mode: "none"
    restart: "no"

  minio:
    logging: *default-logging
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "1000:0"
    command: ["minio", "server", "/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      MINIO_ROOT_PASSWORD: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    secrets:
      - source: aistor_license
        target: /minio.license
        uid: "1000"
        gid: "0"
        mode: 0440
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - happylearn
    mem_limit: 512m
    cpus: 0.3

  app-secrets-init:
    logging: *default-logging
    image: debian:12.12-slim
    user: "0:0"
    entrypoint:
      - /usr/bin/timeout
      - --foreground
      - --kill-after=5s
      - 30s
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        for name in metrics-bearer host-metrics-hmac; do
          test -f "/source/$${name}"
        done
        for name in metrics-bearer host-metrics-hmac; do
          rm -f "/secrets/.$${name}.new"
          cp "/source/$${name}" "/secrets/.$${name}.new"
          chown 10001:10001 "/secrets/.$${name}.new"
          chmod 0400 "/secrets/.$${name}.new"
        done
        for name in metrics-bearer host-metrics-hmac; do
          mv -f "/secrets/.$${name}.new" "/secrets/$${name}"
          test "$(stat -c '%u:%g:%a' "/secrets/$${name}")" = '10001:10001:400'
        done
        chown 10001:10001 /secrets
        chmod 0500 /secrets
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_secrets:/secrets:rw
    secrets:
      - source: metrics_bearer_secret
        target: /source/metrics-bearer
      - source: host_metrics_hmac_secret
        target: /source/host-metrics-hmac
    network_mode: "none"
    restart: "no"
    mem_limit: 64m
    cpus: 0.05

  app:
    logging: *default-logging
    build:
      context: ..
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      HAPPYLEARN_ENV: development
      HAPPYLEARN_LISTEN: ":8080"
      HAPPYLEARN_INTERNAL_LISTEN: ":9090"
      HAPPYLEARN_DATABASE_URL: postgres://happylearn:happylearn_dev@postgres:5432/happylearn?sslmode=disable
      HAPPYLEARN_REDIS_URL: redis://redis:6379/0
      HAPPYLEARN_LOGIN_THROTTLE_SECRET: development-only-app-secret-at-least-32-bytes
      HAPPYLEARN_PUBLIC_ORIGIN: http://127.0.0.1:8080
      HAPPYLEARN_METRICS_BEARER_SECRET_FILE: /run/secrets/metrics-bearer
      HAPPYLEARN_HOST_METRICS_HMAC_SECRET_FILE: /run/secrets/host-metrics-hmac
      HAPPYLEARN_AI_MASTER_KEY: ${HAPPYLEARN_AI_MASTER_KEY:-}
      HAPPYLEARN_AI_MASTER_KEY_VERSION: ${HAPPYLEARN_AI_MASTER_KEY_VERSION:-1}
      HAPPYLEARN_AI_BUSINESS_TIMEZONE: ${HAPPYLEARN_AI_BUSINESS_TIMEZONE:-Asia/Shanghai}
      HAPPYLEARN_AI_GLOBAL_CONCURRENCY: ${HAPPYLEARN_AI_GLOBAL_CONCURRENCY:-2}
      HAPPYLEARN_AI_PER_STUDENT_CONCURRENCY: ${HAPPYLEARN_AI_PER_STUDENT_CONCURRENCY:-1}
      HAPPYLEARN_AI_ALLOW_PRIVATE_PROVIDER: ${HAPPYLEARN_AI_ALLOW_PRIVATE_PROVIDER:-false}
      HAPPYLEARN_MINIO_ENDPOINT: minio:9000
      HAPPYLEARN_MINIO_ACCESS_KEY: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      HAPPYLEARN_MINIO_SECRET_KEY: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
      HAPPYLEARN_MINIO_ORIGINALS_BUCKET: happylearn-originals
      HAPPYLEARN_MINIO_PREVIEWS_BUCKET: happylearn-previews
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - app_secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.2
    depends_on:
      app-secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - happylearn

  worker:
    logging: *default-logging
    build:
      context: ..
      dockerfile: Dockerfile.worker
    user: "10002:10002"
    environment:
      HAPPYLEARN_ENV: development
      HAPPYLEARN_LISTEN: ":8080"
      HAPPYLEARN_DATABASE_URL: postgres://happylearn:happylearn_dev@postgres:5432/happylearn?sslmode=disable
      HAPPYLEARN_REDIS_URL: redis://redis:6379/0
      HAPPYLEARN_LOGIN_THROTTLE_SECRET: development-only-worker-secret-at-least-32-bytes
      HAPPYLEARN_PUBLIC_ORIGIN: http://127.0.0.1:8080
      HAPPYLEARN_MINIO_ENDPOINT: minio:9000
      HAPPYLEARN_MINIO_ACCESS_KEY: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      HAPPYLEARN_MINIO_SECRET_KEY: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
      HAPPYLEARN_MINIO_ORIGINALS_BUCKET: happylearn-originals
      HAPPYLEARN_MINIO_PREVIEWS_BUCKET: happylearn-previews
      HAPPYLEARN_WORK_DIR: /work
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,size=1024m,uid=10002,gid=10002,mode=0700
      - /tmp:rw,noexec,nosuid,size=32m,uid=10002,gid=10002,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1792m
    cpus: 0.6
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1792m
          cpus: "0.6"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - happylearn

  backup-storage-init:
    logging: *default-logging
    profiles: ["backup"]
    image: ${HAPPYLEARN_BACKUP_IMAGE:-happylearn-backup:phase5}
    build:
      context: ..
      dockerfile: Dockerfile.backup
    user: "0:0"
    entrypoint:
      - /usr/bin/timeout
      - --foreground
      - --kill-after=10s
      - 300s
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        chown 10003:0 /repository /state
        chmod 0700 /repository /state
        test "$(stat -c '%u:%g:%a' /repository)" = '10003:0:700'
        test "$(stat -c '%u:%g:%a' /state)" = '10003:0:700'
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${HAPPYLEARN_BACKUP_REPOSITORY_DIRECTORY:-/var/lib/happylearn/backup/repository}:/repository:rw
      - ${HAPPYLEARN_BACKUP_STATE_DIRECTORY:-/var/lib/happylearn/backup/state}:/state:rw
    network_mode: "none"
    restart: "no"
    mem_limit: 64m
    cpus: 0.05

  backup-secrets-init:
    logging: *default-logging
    profiles: ["backup"]
    image: ${HAPPYLEARN_BACKUP_IMAGE:-happylearn-backup:phase5}
    build:
      context: ..
      dockerfile: Dockerfile.backup
    user: "0:0"
    entrypoint:
      - /usr/bin/timeout
      - --foreground
      - --kill-after=10s
      - 300s
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        for name in database_password local_repository local_password; do
          test -f "/source/$${name}"
        done
        for name in database_password local_repository local_password \
          remote_repository remote_password remote_access_key_id \
          remote_secret_access_key; do
          rm -f "/secrets/.$${name}.new"
          if [ -f "/source/$${name}" ]; then
            cp "/source/$${name}" "/secrets/.$${name}.new"
            chown 10003:0 "/secrets/.$${name}.new"
            chmod 0400 "/secrets/.$${name}.new"
            mv -f "/secrets/.$${name}.new" "/secrets/$${name}"
          else
            rm -f "/secrets/$${name}"
          fi
        done
        chown 10003:0 /secrets
        chmod 0700 /secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${HAPPYLEARN_BACKUP_SECRET_DIRECTORY:-/var/lib/happylearn/backup/secrets}:/source:ro
      - backup_secrets:/secrets:rw
    network_mode: "none"
    restart: "no"
    mem_limit: 64m
    cpus: 0.05

  backup:
    logging: *default-logging
    profiles: ["backup"]
    image: ${HAPPYLEARN_BACKUP_IMAGE:-happylearn-backup:phase5}
    build:
      context: ..
      dockerfile: Dockerfile.backup
    user: "10003:0"
    init: true
    hostname: ${HAPPYLEARN_BACKUP_CONTAINER_HOSTNAME:-happylearn-backup}
    entrypoint:
      - /usr/bin/timeout
      - --foreground
      - --kill-after=10s
      - ${HAPPYLEARN_BACKUP_EXTERNAL_TIMEOUT_SECONDS:-2700}s
      - /app/happylearn-backup
    environment:
      TMPDIR: /work
      HAPPYLEARN_DATABASE_HOST: ${HAPPYLEARN_BACKUP_DATABASE_HOST:-postgres}
      HAPPYLEARN_DATABASE_PORT: ${HAPPYLEARN_BACKUP_DATABASE_PORT:-5432}
      HAPPYLEARN_DATABASE_USER: ${HAPPYLEARN_BACKUP_DATABASE_USER:-happylearn}
      HAPPYLEARN_DATABASE_NAME: ${HAPPYLEARN_BACKUP_DATABASE_NAME:-happylearn}
      HAPPYLEARN_DATABASE_SSLMODE: ${HAPPYLEARN_BACKUP_DATABASE_SSLMODE:-require}
      HAPPYLEARN_BACKUP_AGE_RECIPIENT: ${HAPPYLEARN_BACKUP_AGE_RECIPIENT:-age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqp5m40h}
      HAPPYLEARN_BACKUP_ENCRYPTION_KEY_ID: ${HAPPYLEARN_BACKUP_ENCRYPTION_KEY_ID:-development-backup-key}
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,size=1024m,uid=10003,gid=0,mode=0700
      - /tmp:rw,noexec,nosuid,size=16m,uid=10003,gid=0,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - minio_data:/source/aistor:ro
      - ${HAPPYLEARN_BACKUP_REPOSITORY_DIRECTORY:-/var/lib/happylearn/backup/repository}:/repository:rw
      - ${HAPPYLEARN_BACKUP_STATE_DIRECTORY:-/var/lib/happylearn/backup/state}:/state:rw
      - backup_secrets:/run/secrets:ro
    restart: "no"
    networks:
      - happylearn
    mem_limit: 768m
    cpus: 0.4

networks:
  happylearn:
    driver: bridge
    internal: true

volumes:
  minio_data:
  postgres_tls:
  backup_secrets:
  app_secrets:

secrets:
  aistor_license:
    file: ${HAPPYLEARN_AISTOR_LICENSE_FILE:?set HAPPYLEARN_AISTOR_LICENSE_FILE to the downloaded AIStor Free minio.license path}
  metrics_bearer_secret:
    file: ${HAPPYLEARN_METRICS_BEARER_SECRET_FILE:-./fixtures/development-metrics-bearer-do-not-use-in-production}
  host_metrics_hmac_secret:
    file: ${HAPPYLEARN_HOST_METRICS_HMAC_SECRET_FILE:-./fixtures/development-host-metrics-hmac-do-not-use-in-production}

x-happylearn-backup-secret-files:
  required:
    - database_password
    - local_repository
    - local_password
  optional-remote:
    - remote_repository
    - remote_password
    - remote_access_key_id
    - remote_secret_access_key
