services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: happylearn
      POSTGRES_PASSWORD: happylearn_dev
      POSTGRES_DB: happylearn
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happylearn -d happylearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

  redis:
    image: redis:8.8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - happylearn

  minio-data-init:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:0 /data && chmod 0750 /data"]
    volumes:
      - minio_data:/data
    network_mode: "none"
    restart: "no"

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z@sha256:5dbb753c0dbe6a987dd30ce564f66c0042e291e464d10e792443451d4fec2120
    user: "1000:0"
    command: ["minio", "server", "/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${HAPPYLEARN_MINIO_ACCESS_KEY:-happylearn_dev}
      MINIO_ROOT_PASSWORD: ${HAPPYLEARN_MINIO_SECRET_KEY:-happylearn_minio_dev_secret}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    secrets:
      - source: aistor_license
        target: /minio.license
        uid: "1000"
        gid: "0"
        mode: 0440
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - happylearn

networks:
  happylearn:
    driver: bridge

volumes:
  minio_data:

secrets:
  aistor_license:
    file: ${HAPPYLEARN_AISTOR_LICENSE_FILE:?set HAPPYLEARN_AISTOR_LICENSE_FILE to the downloaded AIStor Free minio.license path}
